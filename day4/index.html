<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes Draft</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <main>
      <div class="top-bar">
        <h1>Notes Draft</h1>
        <button id="theme-toggle" type="button">Dark mode</button>
      </div>

      <label for="note-text">Your note</label>

      <textarea
        id="note-text"
        rows="12"
        placeholder="Start typing your note..."
      ></textarea>

      <div class="counters">
        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>
      </div>

      <button id="clear-btn" type="button">Clear</button>
    </main>
  </body>
</html>
